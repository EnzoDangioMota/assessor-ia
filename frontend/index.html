<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>console — assistente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="console">

    <header class="console__header">
      <div class="header__identity">
        <span class="header__dot" id="status-dot" aria-hidden="true"></span>
        <h1 class="header__title">assistente<span class="header__cursor">_</span></h1>
      </div>
      <div class="header__meta">
        <span class="header__label">sessão</span>
        <code class="header__session" id="session-id">—</code>
        <a class="header__monitor" href="monitor.html">monitor</a>
        <button class="header__reset" id="reset-session" title="Iniciar nova sessão">nova sessão</button>
      </div>
    </header>

    <main class="console__thread" id="thread" aria-live="polite">
      <div class="thread__empty" id="thread-empty">
        <p class="empty__eyebrow">// pronto para receber</p>
        <p class="empty__text">Escreva uma pergunta abaixo para iniciar a conversa com o agente.</p>
      </div>
    </main>

    <section class="console__files" aria-label="Arquivos do usuário">
      <div class="files__toolbar">
        <label class="files__upload" for="arquivo">anexar arquivo</label>
        <input
          id="arquivo"
          class="files__input"
          type="file"
          accept=".xlsx,.pdf,.txt,.md,.csv,.png,.jpg,.jpeg,.webp"
        />
        <span class="files__status" id="files-status" aria-live="polite"></span>
      </div>
      <ul class="files__list" id="files-list" aria-label="Arquivos enviados"></ul>
      <p class="files__help">XLSX, PDF, CSV, texto ou imagem · até 10 MB</p>
    </section>

    <form class="console__composer" id="composer" autocomplete="off">
      <textarea
        class="composer__input"
        id="pergunta"
        placeholder="Digite sua pergunta…"
        rows="1"
        required
      ></textarea>
      <button type="submit" class="composer__send" id="enviar" aria-label="Enviar pergunta">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 9L16 2L11 16L8.5 10.5L2 9Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M8.5 10.5L16 2" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>

    <p class="console__hint" id="hint"></p>

  </div>

  <script src="app.js"></script>
</body>
</html>
